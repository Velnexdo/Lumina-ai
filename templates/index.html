<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LuminaAI Ultra</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
let typingSoundCooldown = false;
let currentMood = "neutral";
const API_URL = window.location.origin;

// ================= PLAN SYSTEM =================
function openPlans(){
    document.getElementById("planModal").style.display = "block";
    showPlanType("personal");
}

function closePlans(){
    document.getElementById("planModal").style.display = "none";
}

function showPlanType(type){
    let container = document.getElementById("plansContainer");
    container.innerHTML = "";

    let plans = [];

    if(type === "personal"){
        plans = [
            {name:"Starter", price:99, features:["Basic AI","Limited chats","Normal speed"]},
            {name:"Pro (Popular)", price:299, features:["Faster replies","Better AI","More usage"]},
            {name:"Ultra", price:599, features:["Unlimited chats","Best AI","Priority speed"]}
        ];
    } else {
        plans = [
            {name:"Business Basic", price:999, features:["Team access","API access","Priority support"]},
            {name:"Business Pro", price:1999, features:["High limits","Faster AI","Advanced tools"]}
        ];
    }

    plans.forEach(p=>{
        let div = document.createElement("div");
        div.className = "plan-card";

        div.innerHTML = `
            <h3>${p.name} - ₹${p.price}</h3>
            <ul>${p.features.map(f=>"<li>"+f+"</li>").join("")}</ul>
            <button onclick="pay(${p.price})">Buy Now</button>
        `;

        container.appendChild(div);
    });
}

function pay(amount){
    var options = {
        "key": "rzp_live_SfMTVjtUvKYFIM",
        "amount": amount * 100,
        "currency": "INR",
        "name": "LuminaAI Ultra",
        "description": "Plan Purchase",
        "handler": function (response){
            alert("✅ Payment Successful! ID: " + response.razorpay_payment_id);
        }
    };

    new Razorpay(options).open();
}

// ================= SOUND =================
function playTypingSound(){
    if(typingSoundCooldown) return;
    typingSoundCooldown = true;
    let audio = new Audio("https://www.soundjay.com/button/sounds/button-16.mp3");
    audio.volume = 0.1;
    audio.play().catch(()=>{});
    setTimeout(()=>typingSoundCooldown=false,120);
}

// ================= CHAT =================
let chats = JSON.parse(localStorage.getItem("chats")||"[]");
let currentChat = [];

function initApp(){
    renderHistory();
}

function save(){
    localStorage.setItem("chats",JSON.stringify(chats));
}

function newChat(){
    if(currentChat.length>0){
        chats.push(currentChat);
        save();
    }
    currentChat=[];
    document.getElementById("chat").innerHTML="";
    renderHistory();
}

function renderHistory(){
    let h=document.getElementById("history");
    h.innerHTML="";
    chats.forEach((c,i)=>{
        let d=document.createElement("div");
        d.innerText="Chat "+(i+1);
        d.onclick=()=>loadChat(i);
        h.appendChild(d);
    });
}

function loadChat(i){
    currentChat=chats[i];
    document.getElementById("chat").innerHTML="";
    currentChat.forEach(m=>addMessage(m.text,m.sender));
}

function sendMessage(){
let input=document.getElementById("message");
let msg=input.value.trim();
if(!msg) return;

addMessage(msg,"user");
currentChat.push({text:msg,sender:"user"});
save();

input.value="";

document.getElementById("typing").style.display="block";

fetch(API_URL + "/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:msg})
})
.then(res=>res.json())
.then(data=>{
setTimeout(()=>{
document.getElementById("typing").style.display="none";
handleBotReply(data.reply||"...");},500);
});
}

function handleBotReply(text){
    typeEffect(text);
    currentChat.push({text:text,sender:"bot"});
    save();
}

function typeEffect(text){
let chat=document.getElementById("chat");
let div=document.createElement("div");
div.classList.add("message","bot");
chat.appendChild(div);

let i=0,temp="";
let interval=setInterval(()=>{
temp+=text[i]||"";
div.innerHTML=marked.parse(temp);
i++;
chat.scrollTop=chat.scrollHeight;
if(i>=text.length){clearInterval(interval);}
},15);
}

function addMessage(text,sender){
let chat=document.getElementById("chat");
let div=document.createElement("div");
div.classList.add("message",sender);
div.innerHTML=marked.parse(text);
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}
</script>

<style>
body {margin:0;font-family:"Segoe UI";background:#343541;color:white;display:flex;height:100vh;}
.sidebar {width:260px;background:#202123;padding:10px;display:flex;flex-direction:column;}
.main {flex:1;display:flex;flex-direction:column;}
.chat-box {flex:1;overflow:auto;padding:20px;}
.message {max-width:800px;margin:10px auto;padding:12px;border-radius:12px;}
.user {background:#444654;}
.bot {background:#3a3b45;}
.input-area {display:flex;padding:10px;border-top:1px solid #444;}
input {flex:1;padding:12px;border-radius:6px;border:none;}
button {margin-left:10px;padding:10px;border:none;border-radius:6px;background:#19c37d;color:white;cursor:pointer;}
.plan-card {background:#2a2b32;padding:15px;margin:10px 0;border-radius:10px;}
</style>
</head>

<body onload="initApp()">

<div class="sidebar">
<button onclick="openPlans()">➕</button>
<button onclick="newChat()">+ New Chat</button>
<div id="history" class="history"></div>
</div>

<div class="main">
<div class="header">🤖 LuminaAI Ultra</div>
<div id="chat" class="chat-box"></div>

<div id="typing" style="display:none;text-align:center;">
<span>Typing...</span>
</div>

<div class="input-area">
<input id="message" placeholder="Type..." oninput="playTypingSound()" />
<button onclick="sendMessage()">Send</button>
</div>
</div>

<!-- PLAN MODAL -->
<div id="planModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7);">
  <div style="width:90%; max-width:600px; background:#1e1e1e; margin:50px auto; padding:20px; border-radius:12px;">

    <h2 style="text-align:center;">Choose Your Plan</h2>

    <div style="display:flex; justify-content:center; gap:10px;">
      <button onclick="showPlanType('personal')">Personal</button>
      <button onclick="showPlanType('business')">Business</button>
    </div>

    <div id="plansContainer"></div>

    <button onclick="closePlans()" style="width:100%; margin-top:10px; background:red;">Close</button>
  </div>
</div>

</body>
</html>
